; BOTcorps Adv — Slice 0 display split, Slice 1 hatch on MENU.
; Target: M5Stack Cardputer Adv (ESP32-S3 / Stamp-S3). Not CYD, not COM13,
; not env cyd28.
;
; Active line is Adv dual: internal ST7789 240x135 menu, external
; ILI9341 320x240 content. CYD / COM13 stays parked.
;
; Pins (HW pin PASS 2026-10-07), external panel on SPI3:
;   SCK 40  MOSI 14  CS 5  DC 6  RST 3  SD_CS 12
; GPIO5 idles HIGH (LCD deselected, Cardputer SD enabled).
; Cap LoRa1262 (NSS G5 / RST G3 / BUSY G6) and Hydra-on-G5 cannot
; coexist with this panel. Never guicmg RST13 / DC15.
;
; Toolchain matches the Cardputer Adv Arduino stack used by the dual
; routing reference. No deauth/Wi-Fi lib override — this slice does
; not build radio features. `pio run` only; nothing here flashes a device.

[platformio]
default_envs = cardputer-adv
src_dir = src

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_unflags = -std=gnu++11
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOTCORPS_VERSION=\"0.0.0-slice1\"
    -std=gnu++17
    -Wall

lib_deps =
    m5stack/M5Cardputer @ 1.1.1
    m5stack/M5Unified @ 0.2.13

; Dual: INT menu + EXT content. -DBOTCORPS_DUAL_SCREEN=1.
[env:cardputer-adv-dual]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DBOTCORPS_DUAL_SCREEN=1

; Dual bin linked into a launcher's ota_0 slot at 0x170000 so a
; dual-screen launcher can start it. Same sources as cardputer-adv-dual.
; Does not upload.
[env:cardputer-adv-dual-launcher]
extends = env:cardputer-adv-dual
board_build.partitions = support_files/launcher_8Mb.csv
